name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to publish (must exist, e.g. v1.3.1)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            script: dist:win
          - os: macos-latest
            label: macOS
            script: dist:mac
          - os: ubuntu-latest
            label: Linux
            script: dist:linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run ${{ matrix.script }}

      - name: List release output
        shell: bash
        run: |
          echo "=== release/ installers and update metadata ==="
          find release -maxdepth 1 -type f \( \
            -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o \
            -name '*.yml' -o -name '*.yaml' -o -name '*.blockmap' \
          \) -ls || true

      - name: Upload release artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mp3-tag-editor-${{ matrix.label }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.yml
            release/*.yaml
            release/*.blockmap
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare upload folder
        shell: bash
        run: |
          mkdir -p upload
          find artifacts -type f \( \
            -name '*.exe' -o \
            -name '*.dmg' -o \
            -name '*.AppImage' -o \
            -name '*.deb' -o \
            -name '*.yml' -o \
            -name '*.yaml' -o \
            -name '*.blockmap' \
          \) -exec cp {} upload/ \;
          echo "=== Installers to publish ==="
          ls -la upload/ || true
          count="$(find upload -maxdepth 1 -type f | wc -l)"
          if [ "$count" -eq 0 ]; then
            echo "No installer files found in artifacts."
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: MP3 Tag Editor ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: false
          files: upload/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
